<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="68%">
      <stop offset="0" stop-color="#3d2b66"/>
      <stop offset="0.5" stop-color="#1c1431"/>
      <stop offset="1" stop-color="#07050d"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e2a0"/>
      <stop offset="0.35" stop-color="#b88a33"/>
      <stop offset="0.65" stop-color="#6b4c16"/>
      <stop offset="1" stop-color="#d9b35b"/>
    </linearGradient>
    <linearGradient id="bladeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe5ef"/>
    </linearGradient>
    <linearGradient id="bladeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c1d0"/>
      <stop offset="1" stop-color="#7b8497"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeaa6"/>
      <stop offset="0.5" stop-color="#cc9d3e"/>
      <stop offset="1" stop-color="#875f1d"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c3525"/>
      <stop offset="1" stop-color="#25190f"/>
    </linearGradient>
    <radialGradient id="pommel" cx="38%" cy="34%" r="70%">
      <stop offset="0" stop-color="#fff2bd"/>
      <stop offset="0.55" stop-color="#d1a246"/>
      <stop offset="1" stop-color="#7a571a"/>
    </radialGradient>
    <linearGradient id="arc1" gradientUnits="userSpaceOnUse" x1="70" y1="173" x2="226" y2="92">
      <stop offset="0" stop-color="#fff468" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff468" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff468" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="arc2" gradientUnits="userSpaceOnUse" x1="97" y1="197" x2="230" y2="128">
      <stop offset="0" stop-color="#fff468" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff468" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff468" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="arc3" gradientUnits="userSpaceOnUse" x1="124" y1="221" x2="234" y2="163">
      <stop offset="0" stop-color="#fff468" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#fff468" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff468" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- icon frame, like a buff icon -->
  <rect width="512" height="512" fill="url(#frame)"/>
  <rect x="14" y="14" width="484" height="484" rx="30" fill="url(#bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="30" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="6"/>

  <g transform="translate(-6 14)">
  <!-- faint aura rings -->
  <circle cx="256" cy="262" r="182" fill="none" stroke="#fff468" stroke-opacity="0.10" stroke-width="3"/>

  <g transform="translate(256 256) scale(1.12) rotate(45) translate(-256 -256)">
    <!-- the swoosh the blade leaves behind -->
    <g fill="none" stroke-linecap="round" filter="url(#softglow)">
      <path d="M70.2,172.7 A250,250 0 0,1 225.5,91.9" stroke="url(#arc1)" stroke-width="13"/>
      <path d="M97.0,196.8 A214,214 0 0,1 229.9,127.6" stroke="url(#arc2)" stroke-width="10"/>
      <path d="M123.7,220.9 A178,178 0 0,1 234.3,163.3" stroke="url(#arc3)" stroke-width="7.5"/>
    </g>

    <!-- dagger -->
    <g filter="url(#shadow)">
      <path d="M256,64 Q228,170 230,300 L256,300 Z" fill="url(#bladeL)"/>
      <path d="M256,64 Q284,170 282,300 L256,300 Z" fill="url(#bladeR)"/>
      <path d="M256,64 Q228,170 230,300" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
      <line x1="256" y1="70" x2="256" y2="298" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2"/>
      <rect x="192" y="298" width="128" height="22" rx="11" fill="url(#guard)"/>
      <circle cx="192" cy="309" r="13" fill="url(#guard)"/>
      <circle cx="320" cy="309" r="13" fill="url(#guard)"/>
      <circle cx="256" cy="309" r="8" fill="#c92f3f"/>
      <circle cx="253" cy="306" r="2.6" fill="#ffd3d8"/>
      <rect x="244" y="320" width="24" height="86" rx="6" fill="url(#grip)"/>
      <g stroke="#7a5638" stroke-width="4" stroke-linecap="round">
        <line x1="246" y1="330" x2="266" y2="342"/>
        <line x1="246" y1="348" x2="266" y2="360"/>
        <line x1="246" y1="366" x2="266" y2="378"/>
        <line x1="246" y1="384" x2="266" y2="396"/>
      </g>
      <circle cx="256" cy="420" r="17" fill="url(#pommel)"/>
    </g>
  </g>

  <!-- sound rings coming off the glint -->
  <g fill="none" stroke="#fff468" stroke-linecap="round" filter="url(#softglow)">
    <path d="M465.2,114.0 A58,58 0 0,1 427.9,158.4" stroke-width="8" stroke-opacity="0.9"/>
    <path d="M482.9,117.1 A76,76 0 0,1 434.1,175.3" stroke-width="6" stroke-opacity="0.5"/>
  </g>

  <!-- the glint at the tip: Poised is ready -->
  <g transform="translate(408.1,103.9)" filter="url(#glow)">
    <path d="M0,-48 L9,-9 L48,0 L9,9 L0,48 L-9,9 L-48,0 L-9,-9 Z" fill="#fffbe6"/>
    <path d="M0,-22 L5,-5 L22,0 L5,5 L0,22 L-5,5 L-22,0 L-5,-5 Z" fill="#fff468" transform="rotate(45)"/>
  </g>
  </g>
</svg>
